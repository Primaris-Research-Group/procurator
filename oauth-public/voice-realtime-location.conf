# Inactive candidate: include inside the TLS server only with the realtime mode.
# The provider validates a single-use, expiring stream token before upgrading.
location ~ "^/assistant/voice/realtime/[A-Za-z0-9_-]{16,128}$" {
  limit_except GET { deny all; }
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host assistant.example.com;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For "";
  proxy_connect_timeout 3s;
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
  proxy_pass http://127.0.0.1:3334;
}
