user www-data;
worker_processes 1;
pid /run/assistant-public-site/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name assistant.example.com;
    location ^~ /.well-known/acme-challenge/ {
      root /opt/procurator/oauth-public/acme;
      try_files $uri =404;
    }
    location / { return 301 https://assistant.example.com$request_uri; }
  }
  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name assistant.example.com;
    ssl_certificate /etc/letsencrypt/live/assistant.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assistant.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    root /opt/procurator/oauth-public/site;
    location = /assistant/voice/webhook {
      limit_except POST { deny all; }
      client_max_body_size 16k;
      proxy_pass http://127.0.0.1:3335;
      proxy_set_header Host assistant.example.com;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }
    location = /assistant { return 301 /assistant/; }
    location /assistant/ { try_files $uri $uri/ =404; }
    location / { return 404; }
  }
}
