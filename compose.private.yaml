services:
  openclaw-gateway:
    build: !reset null
    image: ${OPENCLAW_IMAGE:?Run ./bin/assistant init first}
    ports: !override
      - "127.0.0.1:18789:18789"
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Run ./bin/assistant init first}
      NODE_COMPILE_CACHE: /home/node/.openclaw/cache/node-compile
    mem_limit: ${ASSISTANT_MEMORY_LIMIT:-3g}
    memswap_limit: ${ASSISTANT_MEMORY_SWAP_LIMIT:-6g}
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "try { const results = await Promise.all(['/healthz','/readyz'].map(path => fetch('http://127.0.0.1:18789' + path, {signal: AbortSignal.timeout(3000)}))); process.exit(results.every(r => r.ok) ? 0 : 1); } catch { process.exit(1); }"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  openclaw-cli:
    image: ${OPENCLAW_IMAGE:?Run ./bin/assistant init first}
